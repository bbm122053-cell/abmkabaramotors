<!-- CONSOLIDATED BLOCK: BASE BLOCK 1 (LOGO) + MULTI-ANGLE CARDS + BUSINESS LINES & DECKS + OUR SERVICES + CONTACT -->
<style>
  :root {
    --bg-dark: #0b0d12;
    --bg-card: #131722;
    --bg-elevated: #1a2030;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --accent: #eab308;
    --accent-hover: #ca8a04;
    --border: #262d3d;
    --radius: 12px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.6;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
  }

  .abm-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Base Block 1: Top Logo & Navigation Bar */
  .abm-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(11, 13, 18, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .abm-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 74px;
    gap: 16px;
  }

  .abm-logo-link {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .abm-logo-link img {
    height: 54px;
    width: auto;
    max-width: 180px;
    object-fit: contain;
    border-radius: 6px;
  }

  .abm-nav {
    display: flex;
    align-items: center;
    gap: 20px;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .abm-nav a:hover {
    color: var(--accent);
  }

  /* Shared Buttons */
  .abm-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: 0.2s ease;
  }

  .abm-btn-sm {
    padding: 6px 12px;
    font-size: 0.82rem;
  }

  .abm-btn-primary {
    background: var(--accent);
    color: #111827;
  }

  .abm-btn-primary:hover {
    background: var(--accent-hover);
  }

  .abm-btn-whatsapp {
    background: #16a34a;
    color: #ffffff;
  }

  .abm-btn-whatsapp:hover {
    background: #15803d;
  }

  .abm-btn-outline {
    background: transparent;
    border-color: var(--border);
    color: var(--text-main);
  }

  .abm-btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Hero Section */
  .abm-hero {
    padding: 60px 0 48px;
    border-bottom: 1px solid var(--border);
  }

  .abm-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .abm-hero h1 {
    font-size: clamp(2.1rem, 4.5vw, 3.3rem);
    line-height: 1.15;
    margin-bottom: 14px;
    max-width: 760px;
  }

  .abm-lead {
    color: var(--text-muted);
    font-size: 1.05rem;
    max-width: 680px;
    margin-bottom: 22px;
  }

  .abm-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
  }

  .abm-highlights {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    max-width: 720px;
  }

  .abm-highlight-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 16px;
  }

  .abm-highlight-box strong {
    display: block;
    font-size: 0.96rem;
  }

  .abm-highlight-box span {
    font-size: 0.84rem;
    color: var(--text-muted);
  }

  /* Unified Section Rhythm */
  .abm-section {
    padding: 58px 0;
    border-bottom: 1px solid var(--border);
  }

  .abm-section-head {
    margin-bottom: 24px;
  }

  .abm-section-head h2 {
    font-size: clamp(1.5rem, 3vw, 2.15rem);
    margin-bottom: 6px;
  }

  .abm-section-head p {
    color: var(--text-muted);
    max-width: 680px;
  }

  /* Filter Panel */
  .abm-filter-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 20px;
    display: grid;
    gap: 14px;
  }

  .abm-search {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-dark);
    color: var(--text-main);
    font-size: 0.94rem;
  }

  .abm-filter-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .abm-filter-label {
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-right: 6px;
    text-transform: uppercase;
  }

  .abm-chip {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-muted);
    font-size: 0.82rem;
    cursor: pointer;
  }

  .abm-chip.active,
  .abm-chip:hover {
    background: var(--accent);
    color: #111827;
    border-color: var(--accent);
    font-weight: 600;
  }

  .abm-inventory-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  /* Multi-Angle Inspection & Engine Video Cards */
  .abm-vehicle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 22px;
  }

  .abm-vehicle-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .abm-media
